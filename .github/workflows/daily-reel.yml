name: Daily reel
on:
  schedule:
    - cron: "17 17 * * *"   # 18:17 Zagreb (winter) = 13:17 New York
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe id (optional, e.g. D2)"
        required: false
permissions:
  contents: write
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q playwright requests
          python -m playwright install --with-deps chromium > /dev/null
      - name: Render and publish
        working-directory: engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run_daily.py ${{ github.event.inputs.recipe }}
      - name: Save state and video
        run: |
          git config user.name "protein-plate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add engine/state.json reels/
          git commit -m "Daily reel $(date -u +%F)" || echo "nothing to commit"
          git push
